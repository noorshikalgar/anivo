name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-frames
          path: tests/output/e2e
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f docker/Dockerfile -t anivo:ci .
      - name: Run the image and check it
        run: |
          docker run -d --name anivo -p 8080:8080 -e ANIVO_SERVER_URL=https://example.test anivo:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<title>Anivo</title>'
          curl -fs http://localhost:8080/config.js | grep -q 'https://example.test'
          curl -fsI http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -fs -o /dev/null http://localhost:8080/icons/lucide.json
          test "$(docker exec anivo id -u)" != "0"
      - name: Build and check the server image
        run: |
          docker build -f docker/server.Dockerfile -t anivo-server:ci .
          docker run -d --name anivo-server -p 8081:8081 anivo-server:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8081/healthz && break; sleep 1; done
          id=$(curl -fs -X POST --data-binary @README.md -H 'content-type: application/octet-stream' http://localhost:8081/api/shares | sed -E 's/.*"id":"([^"]+)".*/\1/')
          curl -fs http://localhost:8081/api/shares/$id | cmp - README.md
          test "$(docker exec anivo-server id -u)" != "0"

  cli:
    # Phase 2 gate: the bundled CLI renders on macOS, Windows, and Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - name: Run the bundled CLI
        shell: bash
        run: |
          set -e
          mkdir -p cli-out && cd cli-out
          A="node ../packages/cli/dist/anivo.mjs"
          $A new t.anivo --template load-balancer
          $A lint t.anivo
          $A summary t.anivo
          $A preview t.anivo --step 3 --out p.png --debug
          $A contact-sheet t.anivo --out sheet.png
          $A render t.anivo --out frames --format png-seq --size 320x180 --fps 24 --steps 1
          ls frames | head -3
          test -s p.png && test -s sheet.png
      - name: Check the MCP server starts
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | node packages/cli/dist/anivo.mjs mcp --root . > mcp.out & sleep 8; kill $! 2>/dev/null || true
          grep -q anivo_script_apply mcp.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-${{ matrix.os }}
          path: cli-out/*.png
          retention-days: 7

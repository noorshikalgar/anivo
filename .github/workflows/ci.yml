name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-frames
          path: tests/output/e2e
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f docker/Dockerfile -t anivo:ci .
      - name: Run the image and check it
        run: |
          docker run -d --name anivo -p 8080:8080 -e ANIVO_SERVER_URL=https://example.test anivo:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<title>Anivo</title>'
          curl -fs http://localhost:8080/config.js | grep -q 'https://example.test'
          curl -fsI http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -fs -o /dev/null http://localhost:8080/icons/lucide.json
          test "$(docker exec anivo id -u)" != "0"

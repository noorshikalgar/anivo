server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers (docs/12). Scripts and styles come only from this origin.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: http://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-ancestors 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Runtime configuration from environment variables (40-anivo-config.sh).
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Hashed build files never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
